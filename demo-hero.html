<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROCKETs｜ヒーロー ピン留めデモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080a; --fg:#f2f0ec; --dim:#8e8a84; --line:rgba(242,240,236,.14); --pop:#ffd84a;
  --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  --dp:"Anton","Zen Kaku Gothic New",Impact,sans-serif;
  --pinvh:300;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--jp);overflow-x:hidden}

.hd{position:fixed;top:0;left:0;right:0;height:64px;z-index:60;display:flex;
  align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,42px);
  background:linear-gradient(180deg,rgba(8,8,10,.92),rgba(8,8,10,0));
  pointer-events:none}
.hd .slot{width:clamp(96px,11vw,132px);height:38px;position:relative}
.hd nav{display:flex;gap:clamp(12px,2vw,26px);font-size:12.5px;color:#b9b5af;letter-spacing:.08em}
@media(max-width:640px){.hd nav{display:none}}

#pinwrap{height:calc(var(--pinvh) * 1svh);position:relative}
#stage{position:sticky;top:0;height:100svh;overflow:hidden}

.bgs{position:absolute;inset:0;z-index:0}
.bgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity 2.2s ease;will-change:opacity,transform}
.bgs img.on{opacity:1}
.veil{position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(8,8,10,.62) 0%,rgba(8,8,10,.34) 42%,rgba(8,8,10,.92) 100%)}
.grain{position:absolute;inset:-120%;z-index:2;opacity:.055;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  animation:gr 1.1s steps(3) infinite}
@keyframes gr{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}}

#logo{position:absolute;z-index:20;left:50%;top:42%;
  width:clamp(230px,42vw,560px);transform:translate(-50%,-50%);
  transform-origin:center;will-change:transform,opacity}
#logo img{width:100%;display:block}

#lines{position:absolute;z-index:15;inset:0;display:grid;place-items:center;
  padding:0 clamp(20px,6vw,60px);pointer-events:none}
.line{position:absolute;text-align:center;max-width:22ch;
  opacity:0;will-change:transform,opacity,filter}
.line b{display:block;font-family:var(--dp);letter-spacing:.05em;line-height:1.25;
  font-size:clamp(24px,4.4vw,52px);font-weight:400}
.line span{display:block;margin-top:14px;font-size:clamp(12.5px,1.5vw,16px);
  color:#c6c2bb;letter-spacing:.08em;line-height:2}

.cue{position:absolute;z-index:25;left:50%;bottom:34px;transform:translateX(-50%);
  font-size:10px;letter-spacing:.34em;color:#9a958e;text-align:center;transition:opacity .4s}
.cue i{display:block;width:1px;height:34px;background:linear-gradient(#9a958e,transparent);
  margin:12px auto 0;animation:dr 1.8s ease-in-out infinite}
@keyframes dr{0%,100%{transform:scaleY(.4);opacity:.4}50%{transform:scaleY(1);opacity:1}}

.prog{position:fixed;top:0;left:0;height:2px;background:var(--pop);z-index:70;width:0}

.after{position:relative;z-index:30;background:var(--bg)}
.sec{padding:clamp(60px,10vw,130px) clamp(20px,5vw,64px);border-top:1px solid var(--line)}
.sec h2{font-family:var(--dp);font-size:clamp(30px,5.4vw,64px);letter-spacing:.05em;line-height:1}
.sec h2 em{font-style:normal;font-family:var(--jp);font-size:13px;color:var(--dim);
  letter-spacing:.24em;margin-left:16px}
.row{display:flex;gap:clamp(14px,3vw,40px);align-items:baseline;flex-wrap:wrap;
  padding:26px 0;border-bottom:1px solid var(--line)}
.row .dt{font-family:var(--dp);font-size:clamp(22px,3vw,34px);letter-spacing:.03em}
.row .vn{font-size:14px}
.row .mt{font-size:12.5px;color:var(--dim)}

.panel{position:fixed;right:14px;bottom:14px;z-index:80;background:rgba(16,16,19,.94);
  border:1px solid var(--line);padding:14px 16px;font-size:11.5px;
  backdrop-filter:blur(8px);max-width:min(320px,86vw)}
.panel h4{font-size:11px;letter-spacing:.2em;color:var(--pop);margin-bottom:10px}
.panel label{display:flex;align-items:center;gap:9px;margin:8px 0;color:#c9c5bf}
.panel input[type=range]{flex:1;accent-color:var(--pop)}
.panel .v{width:44px;text-align:right;font-family:var(--dp);color:#fff}
.panel .tog{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.panel button{font-family:var(--jp);font-size:10.5px;letter-spacing:.1em;color:#c9c5bf;
  background:none;border:1px solid var(--line);padding:6px 11px;cursor:pointer}
.panel button.on{color:#111;background:var(--pop);border-color:var(--pop)}
.panel .close{position:absolute;top:8px;right:10px;border:0;padding:2px 6px;font-size:14px}
.mini{position:fixed;right:14px;bottom:14px;z-index:80;display:none}
</style>
</head>
<body>

<div class="prog" id="prog"></div>

<header class="hd">
  <div class="slot" id="slot"></div>
  <nav><span>ライブ</span><span>写真</span><span>音源</span><span>物販</span><span>メンバー</span></nav>
</header>

<div id="pinwrap">
  <div id="stage">
    <div class="bgs" id="bgs"></div>
    <div class="veil"></div>
    <div class="grain" id="grain"></div>
    <div id="logo"><img src="assets/brand/logo.webp" alt="ROCKETs"></div>
    <div id="lines"></div>
    <div class="cue" id="cue">SCROLL<i></i></div>
  </div>
</div>

<div class="after">
  <section class="sec">
    <h2>LIVE<em>ライブ</em></h2>
    <div class="row"><div class="dt">2026.09.18</div><div><div class="vn">共鳴　立川 COSMIC HALL</div>
      <div class="mt">OPEN 18:00 / START 18:30 ／ 共演：niwaka. / Hold my beer / nakanaori</div></div></div>
    <div class="row"><div class="dt">2026.09.24</div><div><div class="vn">画零時　大久保 HOT SHOT</div>
      <div class="mt">OPEN 18:10 / START 18:30 ／ 共演：ぶらいかん / The April Fools / minami</div></div></div>
  </section>
  <section class="sec"><h2>PHOTO<em>写真</em></h2>
    <p style="color:var(--dim);font-size:13px;margin-top:18px">（デモなのでここから先は省略）</p></section>
</div>

<div class="mini" id="mini"><button onclick="document.getElementById('panel').style.display='block';this.parentElement.style.display='none'">⚙ 設定</button></div>

<div class="panel" id="panel">
  <button class="close" onclick="this.parentElement.style.display='none';document.getElementById('mini').style.display='block'">×</button>
  <h4>デモ設定</h4>
  <label>ピンの長さ <input type="range" id="pin" min="150" max="500" step="25" value="300"><span class="v" id="pinv">300</span></label>
  <label>ロゴの縮み <input type="range" id="shr" min="0" max="100" step="5" value="70"><span class="v" id="shrv">70</span></label>
  <div class="tog">
    <button id="bGrain" class="on">ノイズ</button>
    <button id="bZoom"  class="on">写真ズーム</button>
    <button id="bSwap"  class="on">写真切替</button>
    <button id="bHead"  class="on">ヘッダーへ吸込</button>
  </div>
  <p style="color:var(--dim);margin-top:11px;line-height:1.7">
    ゆっくりスクロールしてください。<br>画面は止まったまま、文字だけが流れます。</p>
</div>

<script>
const PHOTOS = ["p002","p044","p093","p094","p143","p167","p178","p179"]
  .map(f=>"assets/photos/"+f+".webp");

const LINES = [
  {b:"東京のパンクバンド", s:""},
  {b:"衝動だけで鳴らす", s:"ギター2本、ベース、ドラム。4人。"},
  {b:"難しいことは\nやってない", s:"速くて、うるさくて、それだけ。"},
  {b:"次は 9.18 立川", s:"COSMIC HALL / 18:30 START"}
];

const bgs=document.getElementById("bgs");
PHOTOS.forEach((src,i)=>{
  const im=new Image(); im.src=src; im.alt=""; im.decoding="async";
  if(i===0) im.className="on";
  bgs.appendChild(im);
});
const imgs=[...bgs.querySelectorAll("img")];

const linesEl=document.getElementById("lines");
LINES.forEach(l=>{
  const d=document.createElement("div"); d.className="line";
  d.innerHTML="<b>"+l.b.replace(/\n/g,"<br>")+"</b>"+(l.s?"<span>"+l.s+"</span>":"");
  linesEl.appendChild(d);
});
const lineEls=[...linesEl.querySelectorAll(".line")];

const S={pin:300, shrink:0.70, grain:true, zoom:true, swap:true, head:true};
const $=id=>document.getElementById(id);
function setPin(v){ S.pin=+v; document.documentElement.style.setProperty("--pinvh",v); $("pinv").textContent=v; }
$("pin").addEventListener("input",e=>{setPin(e.target.value); onScroll();});
$("shr").addEventListener("input",e=>{S.shrink=e.target.value/100; $("shrv").textContent=e.target.value; onScroll();});
function tog(id,key,fn){ const b=$(id); b.addEventListener("click",()=>{ S[key]=!S[key]; b.classList.toggle("on",S[key]); if(fn)fn(); onScroll(); }); }
tog("bGrain","grain",()=>$("grain").style.display=S.grain?"":"none");
tog("bZoom","zoom"); tog("bSwap","swap"); tog("bHead","head");

let cur=0;
setInterval(()=>{
  if(!S.swap) return;
  imgs[cur].classList.remove("on");
  cur=(cur+1)%imgs.length;
  imgs[cur].classList.add("on");
}, 4200);

const wrap=$("pinwrap"), logo=$("logo"), cue=$("cue"), prog=$("prog"), slot=$("slot");
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

function onScroll(){
  const vh=window.innerHeight;
  const total=wrap.offsetHeight-vh;
  const p=clamp((-wrap.getBoundingClientRect().top)/total,0,1);
  prog.style.width=(p*100)+"%";

  if(S.zoom) imgs.forEach(im=>im.style.transform="scale("+(1.06+p*0.10)+")");
  else imgs.forEach(im=>im.style.transform="none");

  const lp=clamp(p/0.55,0,1), e=ease(lp);
  const sc=1-(1-S.shrink)*e;
  let x=0,y=0;
  if(S.head){
    const r=slot.getBoundingClientRect();
    x=(r.left+r.width/2-window.innerWidth/2)*e;
    y=(r.top+r.height/2-vh*0.42)*e;
  }
  const hs=S.head?(0.20+(S.shrink-0.20)*(1-e)):sc;
  logo.style.transform="translate(calc(-50% + "+x+"px), calc(-50% + "+y+"px)) scale("+(S.head?hs:sc)+")";

  const n=lineEls.length, start=0.10, span=(1-start)/n;
  lineEls.forEach((el,i)=>{
    const s=start+span*i, en=s+span;
    const t=clamp((p-s)/(en-s),0,1);
    let op,ty,bl;
    if(t<=0){ op=0; ty=90; bl=10; }
    else if(t<0.25){ const k=ease(t/0.25); op=k; ty=90-90*k; bl=10-10*k; }
    else if(t<0.72){ const k=(t-0.25)/0.47; op=1; ty=-16*k; bl=0; }
    else { const k=ease((t-0.72)/0.28); op=1-k; ty=-16-70*k; bl=8*k; }
    el.style.opacity=op;
    el.style.filter="blur("+bl+"px)";
    el.style.transform="translateY("+ty+"px)";
  });

  cue.style.opacity = p>0.04 ? 0 : 1;
}
addEventListener("scroll", onScroll, {passive:true});
addEventListener("resize", onScroll);
setPin(300); onScroll();
</script>
</body>
</html>
