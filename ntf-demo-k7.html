   ・右上：JA / EN 切り替え ＋ お知らせベル（未読があると赤い数字）
   ・お知らせの中身は content.js の news に書く
   ============================================================ */
(function(){
"use strict";
const C = window.CONTENT || {};
const $ = s=>document.querySelector(s), $$ = s=>[...document.querySelectorAll(s)];
let EN=false;
try{
  const q=new URLSearchParams(location.search).get("lang");
  if(q==="en"||q==="ja") localStorage.setItem("rockets.lang",q);
  const s=localStorage.getItem("rockets.lang");
  EN = s ? s==="en" : !/^ja/i.test(navigator.language||"");
}catch(e){}
const T=(j,e)=>EN?e:j;
const LF=(o,k)=>o ? ((EN && o[k+"En"]) ? o[k+"En"] : (o[k]||"")) : "";
document.body.classList.toggle("en",EN);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const SVG=(p,vb)=>`<svg viewBox="${vb||"0 0 24 24"}">${p}</svg>`;
const IC={
  member:SVG('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>'),
  photo:SVG('<rect x="3" y="6.5" width="18" height="13.5" rx="3"/><circle cx="12" cy="13.2" r="3.4"/><path d="M8.6 6.5l1.4-2.5h4l1.4 2.5"/>'),
  sound:SVG('<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>'),
  shop:SVG('<path d="M5 8h14l-1 13H6L5 8z"/><path d="M9 8a3 3 0 0 1 6 0"/>'),
  bell:SVG('<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.6 2.2H4.4z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>'),
  arrow:SVG('<path d="M7 17L17 7M9 7h8v8"/>')
};
const SNSI={
  x:'<svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7.1 8.1L23.2 22h-6.6l-5.2-6.8L5.5 22H2.4l7.6-8.7L1.2 2H8l4.7 6.2L18.9 2Zm-1.1 18h1.7L7.3 3.8H5.4L17.8 20Z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.8.3 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c0 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2 0-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c0-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2Zm0 3.2A6.6 6.6 0 1 0 18.6 12 6.6 6.6 0 0 0 12 5.4Zm0 10.9A4.3 4.3 0 1 1 16.3 12 4.3 4.3 0 0 1 12 16.3Zm6.9-11.1a1.5 1.5 0 1 1-1.6-1.6 1.5 1.5 0 0 1 1.6 1.6Z"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24"><path d="M20.5 8.6a6.9 6.9 0 0 1-4.6-1.8v7.4a5.9 5.9 0 1 1-5.9-5.9c.3 0 .6 0 .9.1v3a2.9 2.9 0 1 0 2 2.8V2h2.9a4 4 0 0 0 4.7 3.9Z"/></svg>'
};

/* ---------- 次のライブ ---------- */
const pd=l=>{const m=String(l.date||"").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const today=(()=>{const d=new Date(); d.setHours(0,0,0,0); return d;})();
const up=(C.lives||[]).filter(l=>l.past!==true && pd(l) && pd(l)>=today).sort((a,b)=>pd(a)-pd(b));
const N=up[0];
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"], DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"];
let calM="NEXT", calD="—", calC=T("未定","TBA");
if(N){ const d=pd(N), diff=Math.round((d-today)/864e5);
  calM=MON[d.getMonth()]+" "+DOW[d.getDay()]; calD=String(d.getDate());
  calC= diff===0?T("今日","TODAY"): diff===1?T("明日","TOMORROW"): T("あと"+diff+"日","IN "+diff+" DAYS"); }

/* ---------- 下のタブ ---------- */
const TK=window.ROCKETS_TICKET||{url:l=>l.ticket||"",label:l=>LF(l,"ticketLabel")||T("チケット","Tickets")};
const tb=document.createElement("div"); tb.id="tabbar"; /* navタグだとスマホ用メニューのCSSが効いて消えるので div */
tb.innerHTML=
  `<button type="button" data-v="member">${IC.member}<span>MEMBER</span></button>`+
  `<button type="button" data-v="photo">${IC.photo}<span>PHOTO</span></button>`+
  `<button type="button" id="tcal" aria-label="NEXT LIVE"><div class="cal"><div class="cm">${calM}</div><div class="cd">${calD}</div><div class="cc">${calC}</div></div></button>`+
  `<button type="button" data-v="sound">${IC.sound}<span>SOUND</span></button>`+
  `<button type="button" data-v="shop">${IC.shop}<span>SHOP</span></button>`;
document.body.appendChild(tb);

/* 長押ししたまま横にすべらせてタブ移動（LINE風）。指の下に丸い影がついてくる */
(function(){
  const blob=document.createElement("i"); blob.className="tblob"; tb.appendChild(blob);
  const btns=[...tb.querySelectorAll("button")];
  let pid=null, timer=null, active=false, sx=0, lx=0, lt=0, vx=0, target=null, suppress=false;
  const pick=x=>{ let best=null, bd=1e9; btns.forEach(b=>{ const r=b.getBoundingClientRect(), d=Math.abs(r.left+r.width/2-x); if(d<bd){bd=d; best=b;} }); return best; };
  function place(x, settle){
    const br=tb.getBoundingClientRect(), w=blob.offsetWidth;
    const st=settle?1:1+Math.min(.5,Math.abs(vx)*.05), sq=settle?1:1-Math.min(.22,Math.abs(vx)*.02);
    blob.style.transform=`translate3d(${Math.round(x-br.left-w/2)}px,0,0) scale(${st.toFixed(3)},${sq.toFixed(3)})`;
  }
  function mark(){ btns.forEach(b=>b.classList.toggle("hov", b===target)); }
  function start(){
    active=true; tb.classList.add("drag"); target=pick(lx); place(lx,false); mark();
    try{ tb.setPointerCapture(pid); }catch(e){}
    try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
  }
  tb.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse" && e.button!==0) return;
    pid=e.pointerId; sx=lx=e.clientX; lt=performance.now(); vx=0;
    clearTimeout(timer); timer=setTimeout(start, 280);
  });
  tb.addEventListener("pointermove",e=>{
    if(e.pointerId!==pid) return;
    const now=performance.now(); vx=(e.clientX-lx)/Math.max(1,now-lt)*16; lx=e.clientX; lt=now;
    if(!active){ if(Math.abs(lx-sx)>16){ clearTimeout(timer); start(); } return; }
    place(lx,false);
    const t=pick(lx); if(t!==target){ target=t; mark(); try{ if(navigator.vibrate) navigator.vibrate(4); }catch(e){} }
  });
  function end(e){
    if(e.pointerId!==pid) return;
    clearTimeout(timer); pid=null;
    if(!active) return;
    active=false; suppress=true; setTimeout(()=>{ suppress=false; },400);
    const t=target;
    if(t){ const r=t.getBoundingClientRect(); vx=0; place(r.left+r.width/2,true); }
    setTimeout(()=>{ tb.classList.remove("drag"); btns.forEach(b=>b.classList.remove("hov")); },180);
    if(t && e.type==="pointerup") t.click();
  }
  tb.addEventListener("pointerup",end); tb.addEventListener("pointercancel",end);
  // 長押しで移動したときは、指を離した瞬間の「普通のタップ」を無視する（二重に動かないように）
  tb.addEventListener("click",e=>{ if(suppress && e.isTrusted){ e.stopPropagation(); e.preventDefault(); } },true);
  tb.addEventListener("contextmenu",e=>e.preventDefault());
})();

/* ---------- 右上（言語・ベル） ---------- */
const hdr=$("#hdr"), tr=document.createElement("div"); tr.id="topr";
tr.innerHTML=`<button type="button" class="lsw${EN?" en":""}" role="switch" aria-checked="${EN}" aria-label="Language / 言語"><span class="kn"></span><span class="l j">JA</span><span class="l e">EN</span></button>`+
  `<button type="button" id="bell" aria-label="${T("お知らせ","News")}">${IC.bell}<i hidden></i></button>`;
hdr.appendChild(tr);
/* 言語スイッチ：電源スイッチみたいに、左右にすべらせても、押しても切り替わる。
   切り替わるときは一瞬だけ暗くなって（フェードアウト）、また明るくなる（フェードイン） */
(function(){
  const sw=$(".lsw"), kn=sw.querySelector(".kn");
  const MAX=()=>sw.clientWidth-kn.offsetWidth-6;
  let pid=null, x0=0, base=0, moved=false, cur=0, busy=false;
  function go(toEN){
    if(busy) return;
    sw.classList.toggle("en",toEN); kn.style.transform="";
    if(toEN===EN) return;
    busy=true;
    try{ localStorage.setItem("rockets.lang", toEN?"en":"ja");
         sessionStorage.setItem("rockets.noload","1"); sessionStorage.setItem("rockets.lsw.y", String(scrollY)); }catch(e){}
    const f=document.createElement("div"); f.id="lfade"; document.body.appendChild(f);
    // ① スイッチがすべり終わるのを待つ → ② ふわっと暗く → ③ 切り替え（読み直し）→ ④ ふわっと明るく
    setTimeout(()=>f.classList.add("on"), 300);
    setTimeout(()=>{ if(location.search) location.replace(location.pathname+location.hash); else location.reload(); }, 300+200);
  }
  sw.addEventListener("pointerdown",e=>{ if(busy) return; pid=e.pointerId; x0=e.clientX; base=sw.classList.contains("en")?MAX():0; cur=base; moved=false;
    try{ sw.setPointerCapture(pid); }catch(_){} });
  sw.addEventListener("pointermove",e=>{ if(e.pointerId!==pid) return; const dx=e.clientX-x0;
    if(!moved && Math.abs(dx)<4) return; moved=true; sw.classList.add("drag");
    cur=Math.max(0,Math.min(MAX(),base+dx)); kn.style.transform=`translateX(${cur}px)`; });
  const up=e=>{ if(e.pointerId!==pid) return; pid=null; sw.classList.remove("drag");
    if(moved){ go(cur>MAX()/2); } };
  sw.addEventListener("pointerup",up); sw.addEventListener("pointercancel",up);
  sw.addEventListener("click",e=>{ if(moved){ moved=false; return; } go(!sw.classList.contains("en")); });
})();

/* ---------- 画面の切り替え ---------- */
const VIEWS={live:["live"],member:["member"],photo:["photo"],sound:["music","video"],shop:["shop"]};
const SECS=["hero","live","photo","video","music","shop","member","contact"];
function show(v,keepUrl){
  if(!VIEWS[v]) v="live";
  document.body.dataset.view=v;
  SECS.forEach(id=>{const el=document.getElementById(id); if(el) el.classList.toggle("vw-off",!VIEWS[v].includes(id));});
  const ft=$("footer"); if(ft) ft.classList.toggle("vw-off",v!=="live");
  $$("#tabbar [data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  const tc=$("#tcal"); if(tc) tc.classList.toggle("on",v==="live");
  window.scrollTo(0,0);
  if(!keepUrl){ try{ history.replaceState(null,"", v==="live" ? location.pathname : "#"+v); }catch(e){} }
  setTimeout(()=>VIEWS[v].forEach(id=>$$("#"+id+" .reveal").forEach(e=>e.classList.add("in"))),80);
}
$$("#tabbar [data-v]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.v)));
$("#tcal").addEventListener("click",()=>show("live"));      // 真ん中＝次のライブに直行
const brand=$("#brand"); if(brand) brand.addEventListener("click",e=>{e.preventDefault(); show("live");});
const H={"#live":"live","#hero":"photo","#member":"member","#photo":"photo","#music":"sound","#sound":"sound","#shop":"shop","#video":"sound"};

/* ---------- 次のライブ（ライブ画面のいちばん上に大きく） ---------- */
(function(){
  const sec=$("#live"); if(!sec || !N) return;
  const tm=(N.open||N.start)?`OPEN ${N.open||"—"} / START ${N.start||"—"}`:"";
  const pr=LF(N,"price")||[N.adv&&("ADV "+N.adv),N.door&&("DOOR "+N.door)].filter(Boolean).join(" / ");
  const inf=[tm,pr,LF(N,"note")].filter(Boolean).map(esc).join("\n");
  const d=pd(N), md=(d.getMonth()+1)+"."+String(d.getDate()).padStart(2,"0");
  const ven=LF(N,"venue"), ttl=LF(N,"title");
  const card=document.createElement("div"); card.id="nextcard"; card.className="nl nl8 reveal";
  // ポスター見出し：日付（赤）→ 地名 → 会場名。会場名は「地名 会場」の形で書いてあれば自動で2行に分ける
  const sp=ven.indexOf(" "), area=sp>0?ven.slice(0,sp):"", place=sp>0?ven.slice(sp+1):ven;
  const isJa=t=>/[^\x00-\x7f]/.test(t);
  // 地図：Googleマップで会場をひらく（content.js の address があるときだけ）
  const mapUrl=N.address ? "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((N.mapQuery||(place+" "+String(N.address).split(" ")[0]))) : "";
  const PINI='<svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.6" fill="#000"/></svg>';
  card.innerHTML=`<div class="top"><span>NEXT LIVE</span><b>${esc(calC)}</b></div>
    <div class="pst"><div class="d">${md} ${DOW[d.getDay()]}</div>
      ${area?`<div class="${isJa(area)?"jp":"en"}">${esc(isJa(area)?area:area.toUpperCase())}</div>`:""}
      <div class="${isJa(place)?"jp":"en"}">${esc(isJa(place)?place:place.toUpperCase())}</div></div>
    ${ttl?`<div class="ttl">${esc(ttl)}</div>`:""}
    ${inf?`<div class="inf">${inf}</div>`:""}
    <div class="acts">
      ${N.ticket?`<a class="y" href="${esc(TK.url(N))}" target="_blank" rel="noopener">${N.ticket==="x-dm"?SNSI.x:""}${esc(TK.label(N))}</a>`:""}
      ${mapUrl?`<a class="mapb" href="${esc(mapUrl)}" target="_blank" rel="noopener">${PINI}${T("地図を見る","View map")}</a>`:""}
      <button type="button" data-a="share">${T("友だちに送る","Send to a friend")}</button>
    </div>`;
  const head=sec.querySelector(".head"); if(head) head.after(card); else sec.prepend(card);
  // 下の一覧からは同じライブを外し、残りがあれば「その後のライブ」として見せる
  const first=$("#upcoming .liverow"); if(first) first.remove();
  if($("#upcoming .liverow")){
    const sub=document.createElement("div"); sub.className="nl-sub"; sub.textContent=T("その後のライブ","MORE SHOWS");
    $("#upcoming").before(sub);
  }
  // 友だちに送る：iPhoneの共有画面が開く → LINE・インスタ・Xの相手を選ぶと、誘いの文が入った状態になる
  card.querySelector('[data-a="share"]').addEventListener("click",async()=>{
    const DJ=["日","月","火","水","木","金","土"], ME=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], DE=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const msg=EN ? `ROCKETs are playing ${ven} on ${DE[d.getDay()]}, ${ME[d.getMonth()]} ${d.getDate()}. Wanna come with me?`
                 : `${d.getMonth()+1}月${d.getDate()}日(${DJ[d.getDay()]})に${ven}でROCKETsのライブがあるんだけど、一緒に行かない？`;
    const full=msg+"\nhttps://rockets-band.vercel.app/";
    try{ if(navigator.share){ await navigator.share({text:full}); return; } }catch(e){ return; }
    try{ await navigator.clipboard.writeText(full); alert(T("誘いの文をコピーしました。LINEやDMに貼り付けて送ってね","Message copied. Paste it into LINE or a DM.")); }catch(e){}
  });
})();

/* ---------- シート（下から出る画面） ---------- */
function sheet(html){
  const s=document.createElement("div"); s.className="sheet";
  s.innerHTML=`<div class="bg"></div><div class="pn"><div class="grip"></div>${html}</div>`;
  document.body.appendChild(s); document.body.style.overflow="hidden";
  const close=()=>{s.remove(); document.body.style.overflow="";};
  s.querySelector(".bg").addEventListener("click",close);
  let y0=null; const pn=s.querySelector(".pn");
  pn.addEventListener("touchstart",e=>{y0=pn.scrollTop<=0?e.touches[0].clientY:null;},{passive:true});
  pn.addEventListener("touchend",e=>{ if(y0!=null && e.changedTouches[0].clientY-y0>90) close(); },{passive:true});
  return {el:s,close};
}

/* ---------- プッシュ通知（OneSignal） ----------
   ・content.js の push.oneSignalAppId があるときだけ動く
   ・iPhone はホーム画面に追加したアプリから開いたときだけ受け取れる
   ・「通知を受け取る」は本人が押す（勝手に許可を聞かない）。断った人には2週間出さない */
(function(){
  const PU=C.push||{}, APP=String(PU.oneSignalAppId||"").trim(); if(!APP) return;
  if(!("Notification" in window) || !("serviceWorker" in navigator)) return;
  const UA=navigator.userAgent||"";
  const ios=/iPad|iPhone|iPod/.test(UA)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  return;
  const sdk=document.createElement("script"); sdk.src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"; sdk.defer=true;
  document.head.appendChild(sdk);
  window.OneSignalDeferred=window.OneSignalDeferred||[];
  window.OneSignalDeferred.push(async function(OS){
    try{
      await OS.init({ appId:APP, safari_web_id:PU.safariWebId||undefined,
        serviceWorkerPath:"sw.js", serviceWorkerParam:{scope:"/"},
        notifyButton:{enable:false}, promptOptions:{slidedown:{prompts:[]}} });
    }catch(e){ return; }
    try{ OS.User.setLanguage(EN?"en":"ja"); }catch(e){}
    if(!OS.Notifications.isPushSupported() || OS.Notifications.permission || Notification.permission==="denied") return;
    window.__rkPush=async()=>{ try{ await OS.Notifications.requestPermission(); }catch(e){} };
    const NK="rockets.ntf.dismissed"; let last=0; try{ last=+localStorage.getItem(NK)||0; }catch(e){}
    if(last && Date.now()-last<14*864e5) return;
    const card=document.createElement("div"); card.id="ntf";
    card.innerHTML=`<div class="hh">LET'S GO!!<br>PUNK ROCK!!</div>
      <div class="pl"><b class="lb">${BELLI}${T("通知をONにすると届くもの","Turn on notifications to get")}</b>
      <ul><li>${T("新しいライブの告知","New show announcements")}</li><li>${T("チケット取り置きの開始","When ticket reservations open")}</li></ul></div>
      <div class="b"><button type="button" class="no">${T("あとで","Later")}</button><button type="button" class="ok">${T("ONにする","Turn on")}</button></div>`;
    document.body.appendChild(card);
    const close=rem=>{ card.classList.remove("in"); setTimeout(()=>card.remove(),400); if(rem){ try{ localStorage.setItem(NK,String(Date.now())); }catch(e){} } };
    card.querySelector(".no").onclick=()=>close(true);
    card.querySelector(".ok").onclick=async()=>{ close(false); await window.__rkPush(); };
    setTimeout(()=>requestAnimationFrame(()=>card.classList.add("in")), 4500);
  });
})();

/* ---------- お知らせ（ベル） ---------- */
const BELLI='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.6 2.2H4.4z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>';
const NEWS=(C.news||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
const nid=n=>n.date+"|"+n.title;
let READ=[]; try{READ=JSON.parse(localStorage.getItem("rockets.news.read")||"[]");}catch(e){}
function badge(){
  const n=NEWS.filter(x=>!READ.includes(nid(x))).length, i=$("#bell i");
  i.hidden=!n; i.textContent=n>9?"9+":String(n);
}
badge();
$("#bell").addEventListener("click",()=>{
  const items=NEWS.map(x=>{
    const isNew=!READ.includes(nid(x));
    const t=LF(x,"title"), b=LF(x,"body");
    return `<a class="it${isNew?" new":""}" href="${esc(x.link||"#")}" data-link="${esc(x.link||"")}">
      <div class="tx"><div class="tg">${esc(LF(x,"tag"))}</div><div class="t">${esc(t)}</div>${b?`<div class="b">${esc(b)}</div>`:""}</div>
      <div class="dt">${esc(String(x.date).slice(5).replace("-","."))}</div>${isNew?'<i class="dot"></i>':""}</a>`;}).join("");
  const pushBtn=window.__rkPush?`<button type="button" class="pushon">${BELLI}${T("ライブ通知をONにする","Turn on show notifications")}</button>`:"";
  const s=sheet(`<div class="news"><h3>NEWS</h3>${pushBtn}${items||`<p style="color:var(--dim);margin-top:14px">${T("お知らせはまだありません","No news yet")}</p>`}</div>`);
  s.el.querySelectorAll(".it").forEach(a=>a.addEventListener("click",e=>{
    const l=a.dataset.link; if(!l || l.startsWith("http")) return;
    e.preventDefault(); s.close(); show(H[l]||"live");
  }));
  const pb=s.el.querySelector(".pushon"); if(pb) pb.addEventListener("click",async()=>{ s.close(); await window.__rkPush(); });
  READ=NEWS.map(nid); try{localStorage.setItem("rockets.news.read",JSON.stringify(READ));}catch(e){}
  badge();
});

/* ---------- メンバー（1人ずつ大きく横スワイプ。端の人もまん中で止まる） ---------- */
const FONT={cb:"f-cb",rg:"f-rg",se:"f-se",zk:"f-zk"};
const psrc=f=>f.includes("/")?"assets/"+f:"assets/photos/"+f;
const mg=$("#mgrid");
if(mg){
  const MS=C.members||[];
  mg.innerHTML=MS.map(m=>{
    const links=["x","instagram","tiktok"].filter(k=>m[k]).map(k=>`<a href="${esc(m[k])}" target="_blank" rel="noopener" aria-label="${k}">${SNSI[k]}</a>`).join("");
    const nm=LF(m,"name"), pt=LF(m,"part"), wd=LF(m,"word");

      <div class="ov"><div class="nm ${FONT[m.font]||"f-zk"}">${esc(nm)}</div><div class="pw">${esc(pt)}${wd?"　／　"+esc(wd):""}</div></div>
      <div class="ms">${links}</div></div>`;}).join("");
  const dots=document.createElement("div"); dots.className="mdots";
  dots.innerHTML=MS.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("");
  mg.after(dots);
  mg.addEventListener("scroll",()=>{
    const c=mg.querySelector(".mc"); if(!c) return;
    const i=Math.round(mg.scrollLeft/(c.offsetWidth+14));
    dots.querySelectorAll("i").forEach((d,k)=>d.classList.toggle("on",k===i));
  },{passive:true});
  const S=C.sns||{}, handle=u=>{const p=String(u).replace(/\/+$/,"").split("/").pop(); return p?(p.startsWith("@")?p:"@"+p):"";};
  const bl=document.createElement("div"); bl.className="biglinks";
  bl.innerHTML=[["x","X"],["instagram","Instagram"],["tiktok","TikTok"],["youtube","YouTube"]].filter(([k])=>S[k])
    .map(([k,l])=>`<a href="${esc(S[k])}" target="_blank" rel="noopener"><span class="l">${l}${IC.arrow}</span><span class="h">${esc(handle(S[k]))}</span></a>`).join("");
  dots.after(bl);
  if(S.x){ const c=document.createElement("a"); c.className="mcontact"; c.href=S.x; c.target="_blank"; c.rel="noopener";
    c.innerHTML=`<span class="lb">BOOKING / CONTACT</span><span class="tx">${T("出演依頼・お問い合わせは<br>X の DM へ","Booking & inquiries:<br>DM us on X")}</span><span class="ar">→</span>`;
    bl.after(c); }
}
})();
</script>

<script>
(function(){
  const EN=(()=>{try{return localStorage.getItem("rockets.lang")==="en"}catch(e){return false}})();
  const T=(j,e)=>EN?e:j;
  const BELL='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.6 2.2H4.4z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>';
  window.__rkPush=async()=>{ alert(T("デモなので、ここでは通知はONになりません","Demo only — nothing is turned on")); };
  let th=0; try{ th=+(new URLSearchParams(location.search).get("c")||0) }catch(e){}
  const bar=document.getElementById("dmbar");
  const mark=()=>bar.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("on",+b.dataset.t===th));
  function open(delay){
    let c=document.getElementById("ntf"); if(c) c.remove();
    c=document.createElement("div"); c.id="ntf"; c.className="dm th"+th;
    c.innerHTML=`<div class="hh">LET'S GO!!<br>PUNK ROCK!!</div>
      <div class="pl"><b class="lb">${BELL}${T("通知をONにすると届くもの","Turn on notifications to get")}</b>
      <ul><li>${T("新しいライブの告知","New show announcements")}</li><li>${T("チケット取り置きの開始","When ticket reservations open")}</li></ul></div>
      <div class="b"><button type="button" class="no">${T("あとで","Later")}</button><button type="button" class="ok">${T("ONにする","Turn on")}</button></div>`;
    document.body.appendChild(c);
    const close=()=>{ c.classList.remove("in"); setTimeout(()=>c.remove(),400); };
    c.querySelector(".no").onclick=close;
    c.querySelector(".ok").onclick=()=>{ close(); window.__rkPush(); };
    setTimeout(()=>requestAnimationFrame(()=>c.classList.add("in")),delay);
  }
  bar.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.classList.contains("again")){ open(350); return; }
    th=+b.dataset.t; mark();
    const c=document.getElementById("ntf");
    if(c&&c.classList.contains("in")){ c.className="dm in th"+th; } else open(250);
    try{ history.replaceState(null,"","?c="+th+location.hash) }catch(e){}
  });
  mark(); open(1800);
})();
</script>
